name: Build APK

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: write

env:
  SOURCE_TAG: v0.1.0-beta

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      # The tree lives in the release archive: 193 source files could not be pushed
      # through the API from the environment that produced them.
      #
      # Deterministic URL, not `gh release list`: the first two runs died in nine
      # seconds because that command was parsed before the release existed. A fixed
      # URL either works or fails loudly, and it fails with an HTTP code.
      - name: Materialise source tree
        run: |
          set -euo pipefail
          URL="${{ github.server_url }}/${{ github.repository }}/releases/download/${SOURCE_TAG}/source.zip"
          echo "fetching $URL"
          curl -fL --retry 3 -o /tmp/source.zip "$URL"
          mkdir -p /tmp/src && unzip -q /tmp/source.zip -d /tmp/src
          cp -a /tmp/src/OpenClaudeMobile/. ./
          ls

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install SDK packages
        run: sdkmanager --install "platforms;android-35" "build-tools;35.0.0" "ndk;27.0.12077973" "cmake;3.22.1"

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('**/*.gradle.kts', 'gradle/libs.versions.toml') }}

      - name: Fetch runtime payloads
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          chmod +x scripts/fetch-runtime-payloads.sh
          ./scripts/fetch-runtime-payloads.sh

      - name: Unit tests
        run: gradle :core:testDebugUnitTest --no-daemon --stacktrace

      - name: Build debug APK
        run: gradle :app:assembleDebug --no-daemon --stacktrace

      - name: Build release APK
        run: gradle :app:assembleRelease --no-daemon --stacktrace

      - name: Collect artefacts
        run: |
          mkdir -p out
          cp app/build/outputs/apk/debug/app-debug.apk out/pocketclaw-${SOURCE_TAG}-debug.apk || true
          find app/build/outputs/apk/release -name '*.apk' -exec cp {} out/pocketclaw-${SOURCE_TAG}-release.apk \; || true
          ls -lh out

      - uses: actions/upload-artifact@v4
        with:
          name: apk
          path: out/*.apk

      - name: Attach to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "${SOURCE_TAG}" out/*.apk -R "${{ github.repository }}" --clobber
