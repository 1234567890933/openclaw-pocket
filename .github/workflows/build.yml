name: Build APK

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: write

env:
  SOURCE_TAG: v0.1.0-beta
  GRADLE_VERSION: "8.11.1"

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Materialise source tree
        run: |
          set -euo pipefail
          URL="${{ github.server_url }}/${{ github.repository }}/releases/download/${SOURCE_TAG}/source.zip"
          curl -fL --retry 3 -o /tmp/source.zip "$URL"
          mkdir -p /tmp/src && unzip -q /tmp/source.zip -d /tmp/src
          cp -a /tmp/src/OpenClaudeMobile/. ./
          ls

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Gradle ${{ env.GRADLE_VERSION }}
        run: |
          set -euo pipefail
          curl -fsSL -o /tmp/gradle.zip \
            "https://services.gradle.org/distributions/gradle-${GRADLE_VERSION}-bin.zip"
          unzip -q /tmp/gradle.zip -d /opt
          echo "/opt/gradle-${GRADLE_VERSION}/bin" >> "$GITHUB_PATH"
          gradle --version

      - name: Install Android SDK
        run: |
          set -euo pipefail
          export ANDROID_HOME="$HOME/android-sdk"
          mkdir -p "$ANDROID_HOME/cmdline-tools"
          curl -fsSL -o /tmp/cmdline.zip \
            https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
          unzip -q /tmp/cmdline.zip -d "$ANDROID_HOME/cmdline-tools"
          mv "$ANDROID_HOME/cmdline-tools/cmdline-tools" "$ANDROID_HOME/cmdline-tools/latest"
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"

      - name: Install SDK packages
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager --install "platforms;android-35" "build-tools;35.0.0" "ndk;27.0.12077973" "cmake;3.22.1"

      - name: Create signing keystore
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.android"
          if [ ! -f "$HOME/.android/debug.keystore" ]; then
            keytool -genkeypair -v \
              -keystore "$HOME/.android/debug.keystore" \
              -storepass android -alias androiddebugkey -keypass android \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: ~/.gradle/caches
          key: gradle-${{ env.GRADLE_VERSION }}-${{ hashFiles('**/*.gradle.kts', 'gradle/libs.versions.toml') }}

      - name: Fetch runtime payloads
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          chmod +x scripts/fetch-runtime-payloads.sh
          ./scripts/fetch-runtime-payloads.sh

      - name: Unit tests
        run: gradle :core:testDebugUnitTest --no-daemon --stacktrace

      - name: Build debug APKs (one per ABI)
        run: gradle :app:assembleDebug --no-daemon --stacktrace

      - name: Build release APKs (one per ABI)
        continue-on-error: true
        run: gradle :app:assembleRelease --no-daemon --stacktrace

      # The payloads are aarch64 binaries. Only the arm64 build can run the gateway, so
      # only that one gets them; the others stay small and say what they can do.
      - name: Collect artefacts
        if: always()
        run: |
          set -euo pipefail
          mkdir -p out
          find app/build/outputs/apk/debug -name '*.apk' | while read -r f; do
            abi=$(basename "$f" | sed -E 's/.*-(arm64-v8a|armeabi-v7a|x86_64)-debug\.apk/\1/')
            [ "$abi" = "$(basename "$f")" ] && abi="universal"
            cp "$f" "out/pocketclaw-${SOURCE_TAG}-${abi}-debug.apk"
          done
          find app/build/outputs/apk/release -name '*.apk' 2>/dev/null | while read -r f; do
            abi=$(basename "$f" | sed -E 's/.*-(arm64-v8a|armeabi-v7a|x86_64)-release\.apk/\1/')
            [ "$abi" = "$(basename "$f")" ] && abi="universal"
            cp "$f" "out/pocketclaw-${SOURCE_TAG}-${abi}-release.apk"
          done
          ls -lh out

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: apk
          path: out/*.apk
          if-no-files-found: warn

      - name: Attach to release
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          shopt -s nullglob
          files=(out/*.apk)
          if [ ${#files[@]} -gt 0 ]; then
            gh release upload "${SOURCE_TAG}" "${files[@]}" -R "${{ github.repository }}" --clobber
          else
            echo "no apk produced"
          fi
