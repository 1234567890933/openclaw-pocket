name: Build APK

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: write

env:
  SOURCE_TAG: v0.1.0-beta
  APP_VERSION: "0.1.1-beta"
  GRADLE_VERSION: "8.11.1"

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Materialise source tree
        run: |
          set -euo pipefail
          URL="${{ github.server_url }}/${{ github.repository }}/releases/download/${SOURCE_TAG}/source.zip"
          curl -fL --retry 3 -o /tmp/source.zip "$URL"
          mkdir -p /tmp/src && unzip -q /tmp/source.zip -d /tmp/src
          cp -a /tmp/src/OpenClaudeMobile/. ./

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Gradle ${{ env.GRADLE_VERSION }}
        run: |
          set -euo pipefail
          curl -fsSL -o /tmp/gradle.zip \
            "https://services.gradle.org/distributions/gradle-${GRADLE_VERSION}-bin.zip"
          unzip -q /tmp/gradle.zip -d /opt
          echo "/opt/gradle-${GRADLE_VERSION}/bin" >> "$GITHUB_PATH"

      - name: Install Android SDK
        run: |
          set -euo pipefail
          export ANDROID_HOME="$HOME/android-sdk"
          mkdir -p "$ANDROID_HOME/cmdline-tools"
          curl -fsSL -o /tmp/cmdline.zip \
            https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
          unzip -q /tmp/cmdline.zip -d "$ANDROID_HOME/cmdline-tools"
          mv "$ANDROID_HOME/cmdline-tools/cmdline-tools" "$ANDROID_HOME/cmdline-tools/latest"
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"

      - name: Install SDK packages
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager --install "platforms;android-35" "build-tools;35.0.0" "ndk;27.0.12077973" "cmake;3.22.1"

      - name: Create signing keystore
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.android"
          [ -f "$HOME/.android/debug.keystore" ] || keytool -genkeypair -v \
            -keystore "$HOME/.android/debug.keystore" \
            -storepass android -alias androiddebugkey -keypass android \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: ~/.gradle/caches
          key: gradle-${{ env.GRADLE_VERSION }}-${{ hashFiles('**/*.gradle.kts', 'gradle/libs.versions.toml') }}

      - name: Fetch runtime payloads
        run: |
          chmod +x scripts/fetch-runtime-payloads.sh
          ./scripts/fetch-runtime-payloads.sh

      - name: Assert bundled payloads are real
        run: |
          set -euo pipefail
          fail=0
          check() {
            if [ -s "$1" ] && [ "$(stat -c %s "$1")" -ge "$2" ]; then
              echo "ok   $1 ($(du -h "$1" | cut -f1))"
            else
              echo "MISSING or too small: $1"; fail=1
            fi
          }
          check app/src/main/assets/runtime/node-arm64.pkg   20000000
          check app/src/main/assets/runtime/proot-arm64       200000
          check app/src/main/assets/runtime/openclaw-bundle.pkg 20000000
          exit $fail

      - name: Unit tests
        run: gradle :core:testDebugUnitTest --no-daemon --stacktrace

      - name: Build debug APKs
        run: gradle :app:assembleDebug --no-daemon --stacktrace

      - name: Build release APKs
        continue-on-error: true
        run: gradle :app:assembleRelease --no-daemon --stacktrace

      # `find` exits non-zero when its directory does not exist, and under `set -e`
      # that killed the whole step on the first run that produced no release APK.
      - name: Collect artefacts
        if: always()
        run: |
          mkdir -p out
          for d in debug release; do
            src="app/build/outputs/apk/$d"
            [ -d "$src" ] || { echo "no $d output directory"; continue; }
            find "$src" -name '*.apk' -print0 | while IFS= read -r -d '' f; do
              abi=$(basename "$f" | sed -E 's/.*-(arm64-v8a|armeabi-v7a|x86_64)-[a-z]+\.apk/\1/')
              [ "$abi" = "$(basename "$f")" ] && abi="universal"
              cp "$f" "out/pocketclaw-${APP_VERSION}-${abi}-${d}.apk"
            done
          done
          echo "--- produced ---"
          ls -lh out || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: apk
          path: out/*.apk
          if-no-files-found: warn

      - name: Attach to release
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          shopt -s nullglob
          files=(out/*.apk)
          if [ ${#files[@]} -gt 0 ]; then
            gh release upload "${SOURCE_TAG}" "${files[@]}" -R "${{ github.repository }}" --clobber
          else
            echo "no apk produced"
          fi
