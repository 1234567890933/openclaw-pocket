# Production defaults. These were once set to the values a 2 GB sandbox needed,
# which shipped to CI and killed the Kotlin compiler with an OutOfMemoryError on
# Metaspace. Never size this file for the smallest machine that might open it.
org.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=1024m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true

android.useAndroidX=true
android.nonTransitiveRClass=true
android.enableR8.fullMode=true
kotlin.code.style=official
